services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FORGEGUARD_ENVIRONMENT: production
      FORGEGUARD_CORS_ORIGINS: http://localhost:8000
    volumes:
      - ./backend/knowledge:/workspace/backend/knowledge:ro
      - ./backend/research:/workspace/backend/research:ro
      - ./data:/workspace/data
      - ./artifacts:/workspace/artifacts
