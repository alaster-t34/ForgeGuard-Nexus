[project]
name = "forgeguard-edge-node"
version = "0.7.9"
description = "Hardware-neutral industrial telemetry and evidence gateway"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "numpy>=1.26,<2.1"]

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
mqtt = ["paho-mqtt>=2.1,<3"]
opcua = ["asyncua>=1.1,<2"]

[project.scripts]
forgeguard-edge = "forgeguard_edge.cli:main"
