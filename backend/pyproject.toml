[project]
name = "forgeguard-nexus-api"
version = "0.8.0"
description = "Verified scientific-agent platform with governed industrial evidence workflows"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1",
  "numpy>=1.26,<2.1",
  "scipy>=1.12,<1.15",
  "PyYAML>=6,<7",
  "orjson>=3.10,<4",
  "scikit-learn==1.8.0",
  "joblib>=1.4,<2",
  "python-multipart>=0.0.18,<1"
]

[project.optional-dependencies]
benchmark = ["torch>=2.6,<3"]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
